# One job on one standard runner (C14, plan M0). Pull requests and pushes to main only, so a
# branch with an open PR is not built twice; superseded runs are cancelled.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The deploy token lives in the `staging` environment, restricted to main. Pull requests
    # (including forks) run without it.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'staging' || '' }}
    env:
      WRANGLER_SEND_METRICS: "false"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs on every change, documentation-only ones included: the script needs only Node.
      - name: ADR index and numbers
        run: node scripts/adr-index.mjs --check

      # Documentation-only changes skip the heavy steps but still report this check, so a
      # required status never waits forever (a workflow-level path filter would).
      - name: Detect code changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base=FETCH_HEAD
          else
            base="${{ github.event.before }}"
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || base=""
          fi
          if [ -z "$base" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^assets/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: skipping build and tests."
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.code == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        if: steps.changes.outputs.code == 'true'
        run: pnpm exec biome ci .

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Registry parity (A23)
        if: steps.changes.outputs.code == 'true'
        run: pnpm parity

      - name: OpenAPI is up to date
        if: steps.changes.outputs.code == 'true'
        run: pnpm openapi:check

      - name: Tests (PostgreSQL 17)
        if: steps.changes.outputs.code == 'true'
        run: pnpm test

      - name: Build dashboard and Worker bundle
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      # One Chromium smoke test against the built dashboard (plan N0, ADR 0010). The browser is
      # cached by Playwright version; its system libraries come from apt on every run.
      - name: Cache Playwright browser
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @airstock/web exec playwright install --with-deps chromium

      - name: End-to-end smoke test (Chromium)
        if: steps.changes.outputs.code == 'true'
        run: pnpm e2e

      # Deploys the bundle verified above. Skipped until the staging resources and the
      # CLOUDFLARE_API_TOKEN environment secret exist (plan M1). The token is exposed only
      # to the deploy steps, never to install or test steps.
      - name: Check deploy credentials
        id: deploy
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Forward-only migrations run before the Worker that needs them.
      - name: Migrate staging database
        if: steps.deploy.outputs.ready == 'true'
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm --filter @airstock/db migrate

      - name: Deploy to staging
        if: steps.deploy.outputs.ready == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
