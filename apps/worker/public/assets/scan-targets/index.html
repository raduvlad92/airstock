<!doctype html>
<html lang="en">

<title>Scan test targets · Airstock</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #111; }

</style>
</head>
<body>
<h1>Scan test targets</h1>
<p>Show this page on a second screen at full brightness, or print it. Then open /scan-test on the phone.</p>
